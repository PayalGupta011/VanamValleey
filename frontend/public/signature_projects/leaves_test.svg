<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="280" viewBox="0 0 1024 280">
  <defs>
    <!-- Emerald Leaf Glass Fill -->
    <linearGradient id="leafEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003E30" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#064B39" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0D6244" stop-opacity="0.82" />
    </linearGradient>

    <!-- Champagne Gold Outline -->
    <linearGradient id="leafGoldStroke" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F4C66D" />
      <stop offset="50%" stop-color="#D8AE61" />
      <stop offset="100%" stop-color="#B88938" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(216, 174, 97, 0.35)" />
    </filter>
  </defs>

  <!-- Orbital Line Beneath -->
  <path d="M 40 230 Q 512 280 984 230" fill="none" stroke="#D8AE61" stroke-width="1.5" opacity="0.6" />
  <circle cx="215" cy="248" r="4.5" fill="#FFEAB8" filter="url(#goldGlow)" />
  <circle cx="395" cy="256" r="4.5" fill="#FFEAB8" filter="url(#goldGlow)" />
  <circle cx="535" cy="258" r="5" fill="#FFEAB8" filter="url(#goldGlow)" />
  <circle cx="715" cy="252" r="4.5" fill="#FFEAB8" filter="url(#goldGlow)" />

  <!-- LEAF 1: 27 ACRES (Top-left tip, tilted up-left) -->
  <g transform="translate(30, 25)" filter="url(#goldGlow)">
    <path d="M 12 100 C 35 155, 110 185, 175 180 C 220 175, 238 135, 225 80 C 210 25, 120 15, 12 100 Z"
          fill="url(#leafEmeraldGrad)" stroke="url(#leafGoldStroke)" stroke-width="2.2" />
    <!-- Veins -->
    <path d="M 12 100 C 70 105, 140 100, 215 85" fill="none" stroke="rgba(244, 198, 109, 0.28)" stroke-width="1.2" />
    <path d="M 65 104 C 80 130, 110 150, 140 160" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 95 102 C 110 65, 140 45, 175 35" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 130 98 C 150 125, 175 140, 200 150" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
  </g>

  <!-- LEAF 2: 129 UNITS (Bottom-left tip) -->
  <g transform="translate(265, 45)" filter="url(#goldGlow)">
    <path d="M 15 165 C 60 188, 140 188, 190 150 C 218 125, 215 65, 180 25 C 135 5, 65 25, 30 75 C 10 105, 5 140, 15 165 Z"
          fill="url(#leafEmeraldGrad)" stroke="url(#leafGoldStroke)" stroke-width="2.2" />
    <!-- Veins -->
    <path d="M 15 165 C 50 130, 110 75, 170 35" fill="none" stroke="rgba(244, 198, 109, 0.28)" stroke-width="1.2" />
    <path d="M 55 125 C 90 140, 130 145, 170 135" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 90 95 C 105 60, 130 40, 160 30" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 115 75 C 145 90, 175 95, 195 85" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
  </g>

  <!-- LEAF 3: 15,000 SQ.FT. (Symmetrical crescent) -->
  <g transform="translate(485, 45)" filter="url(#goldGlow)">
    <path d="M 18 90 C 25 150, 95 188, 170 182 C 200 178, 215 155, 212 135 C 205 80, 180 25, 130 12 C 70 5, 22 40, 18 90 Z"
          fill="url(#leafEmeraldGrad)" stroke="url(#leafGoldStroke)" stroke-width="2.2" />
    <!-- Veins -->
    <path d="M 18 90 C 80 100, 150 115, 212 135" fill="none" stroke="rgba(244, 198, 109, 0.28)" stroke-width="1.2" />
    <path d="M 65 98 C 85 135, 120 160, 155 170" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 100 105 C 115 70, 145 45, 175 35" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 145 115 C 165 140, 185 150, 200 155" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
  </g>

  <!-- LEAF 4: 100% FREEHOLD (Right tip pointing up-right) -->
  <g transform="translate(700, 25)" filter="url(#goldGlow)">
    <path d="M 18 95 C 30 155, 120 185, 205 170 C 250 160, 285 130, 305 85 C 275 35, 190 12, 105 18 C 45 25, 18 55, 18 95 Z"
          fill="url(#leafEmeraldGrad)" stroke="url(#leafGoldStroke)" stroke-width="2.2" />
    <!-- Veins -->
    <path d="M 18 95 C 100 105, 200 105, 305 85" fill="none" stroke="rgba(244, 198, 109, 0.28)" stroke-width="1.2" />
    <path d="M 80 102 C 105 135, 150 155, 190 160" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 125 104 C 145 70, 185 45, 225 35" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
    <path d="M 195 103 C 225 130, 255 140, 280 135" fill="none" stroke="rgba(244, 198, 109, 0.2)" stroke-width="1" />
  </g>
</svg>
